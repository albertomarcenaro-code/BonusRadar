name: Supabase keep-alive

# Genera attività quotidiana sul progetto Supabase Free (pausa dopo 7 giorni
# di inattività). Tre ping al giorno spacciati per utenti reali: la regola
# Supabase è "qualche richiesta al database ogni giorno nella settimana".
on:
  schedule:
    - cron: "0 9,15,21 * * *"   # UTC → 11:00, 17:00, 23:00 Europe/Rome
  workflow_dispatch:            # esecuzione manuale per i test

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          code=$(curl -sS --max-time 30 -o /tmp/resp.json -w "%{http_code}" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/bonuses?select=id&limit=1")
          echo "HTTP status: ${code}"
          cat /tmp/resp.json && echo
          if [ "${code}" != "200" ]; then
            echo "::error::Supabase ha risposto ${code} — progetto in pausa o chiavi errate?"
            exit 1
          fi
